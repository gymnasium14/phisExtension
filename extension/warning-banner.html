<!--
  PhishShield — шаблон плавающего окна-предупреждения о фишинге.

  Это чистая разметка + стили, без логики. Логика (когда показывать,
  чем заполнять, что делать по кнопкам) находится в warning-banner.js —
  он подгружает этот файл через fetch() и вставляет содержимое #phishshield-warning
  в Shadow DOM поверх страницы, чтобы стили сайта на него не влияли.

  Файл можно открыть напрямую в браузере, чтобы просто посмотреть на дизайн.
-->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PhishShield — предупреждение</title>
<style>
  #phishshield-warning {
    --ps-accent: #5346e4;
    --ps-danger-bg: #fdeceb;
    --ps-danger-text: #d01f1f;
    --ps-text: #1e293b;
    --ps-text-2: #64748b;
    --ps-text-3: #94a3b8;
    --ps-border: #e2e8f0;
    --ps-card: #ffffff;
    --ps-shadow: 0 20px 45px rgba(15, 23, 42, .18), 0 4px 12px rgba(15, 23, 42, .08);

    all: initial;
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2147483647;
    font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  #phishshield-warning * { box-sizing: border-box; }

  #phishshield-warning .ps-card {
    width: 340px;
    background: var(--ps-card);
    border-radius: 20px;
    box-shadow: var(--ps-shadow);
    padding: 22px 22px 20px;
    overflow: hidden;
    animation: ps-pop .25s ease-out;
  }

  @keyframes ps-pop {
    from { opacity: 0; transform: translateY(-8px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* тонкая индиго-полоса сверху, как в popup */
  #phishshield-warning .ps-topbar {
    height: 5px;
    margin: -22px -22px 18px;
    background: var(--ps-accent);
  }

  #phishshield-warning .ps-pill {
    display: block;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto 14px;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--ps-danger-bg);
    color: var(--ps-danger-text);
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: .02em;
    text-align: center;
    line-height: 1.3;
  }

  #phishshield-warning .ps-text {
    margin: 0 0 18px;
    color: var(--ps-text-2);
    font-size: 13.5px;
    line-height: 1.5;
    text-align: center;
  }

  #phishshield-warning .ps-site-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 2px;
    margin-bottom: 20px;
  }

  #phishshield-warning .ps-globe {
    flex: none;
    width: 20px;
    height: 20px;
    color: var(--ps-text-3);
  }

  #phishshield-warning .ps-url {
    color: var(--ps-text-3);
    font-size: 14px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #phishshield-warning .ps-actions {
    display: flex;
    gap: 10px;
  }

  #phishshield-warning .ps-btn {
    flex: 1;
    padding: 13px 10px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: filter .15s, background .15s;
    font-family: inherit;
  }

  #phishshield-warning .ps-btn-ghost {
    background: var(--ps-card);
    color: var(--ps-text-2);
    border: 1.5px solid var(--ps-border);
  }
  #phishshield-warning .ps-btn-ghost:hover { background: #f8fafc; }

  #phishshield-warning .ps-btn-primary {
    background: var(--ps-accent);
    color: #ffffff;
  }
  #phishshield-warning .ps-btn-primary:hover { filter: brightness(1.08); }

  @media (prefers-color-scheme: dark) {
    #phishshield-warning {
      --ps-text: #eef2f9;
      --ps-text-2: #9aa5bd;
      --ps-text-3: #6b7590;
      --ps-border: #2c3450;
      --ps-card: #1e2434;
      --ps-danger-bg: rgba(231, 76, 60, .16);
    }
    #phishshield-warning .ps-btn-ghost:hover { background: #171c2b; }
  }
</style>
</head>
<body>

<div id="phishshield-warning">
  <div class="ps-card">
    <div class="ps-topbar"></div>

    <div class="ps-pill">УГРОЗА · ВЫ НА ПОТЕНЦИАЛЬНО ФИШИНГОВОМ САЙТЕ</div>

    <p class="ps-text">
      Шанс фишинга свыше 75%, крайне рекомендуется перепроверить подлинность сайта.
    </p>
    
    <div class="ps-actions">
      <button type="button" class="ps-btn ps-btn-ghost" id="ps-btn-proceed">Продолжить</button>
      <button type="button" class="ps-btn ps-btn-primary" id="ps-btn-close">Закрыть сайт</button>
    </div>
  </div>
</div>

</body>
</html>
